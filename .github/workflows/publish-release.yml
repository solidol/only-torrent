name: Publish prepared release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prepared draft tag, for example v0.1.10.25'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify draft assets and publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          version="${RELEASE_TAG#v}"
          archive="Only-Torrent-$version-Win64.zip"
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256"
          sha256sum --check "$archive.sha256"
          unzip -p "$archive" release.json | jq -e --arg version "$version" '.version == $version and .platform == "Win64"'
          gh release edit "$RELEASE_TAG" --draft=false
